<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jake</title>
  <style>
    :root{
      --bg: #f7fbff;
      --text: #13294B; /* requested color */
      --card-bg: #fff;
      --accent:#0969da;
      --radius:14px;
    }
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
    .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:3rem;}
    .card{
      width:min(920px,92%);
      background:transparent;
      text-align:center;
    }

    /* White rounded area that contains "Hello Jake" */
    .hello {
      background:var(--card-bg);
      border-radius: var(--radius);
      padding: 2rem 1.5rem;
      display:inline-block;
      box-shadow: 0 8px 30px rgba(9,20,40,0.06);
      min-width: min(480px,90%);
    }
    .hello h1{
      margin:0;
      font-weight:700;
      color:var(--text);
      font-size:48px; /* requested size */
      line-height:1;
      letter-spacing: -0.5px;
    }

    /* Button below the white box, positioned 1 inch below */
    .action {
      display:inline-block;
      margin-top:1in; /* requested 1 inch distance */
    }
    .btn{
      -webkit-appearance:none;
      border:0;
      background:var(--accent);
      color:white;
      padding:0.85rem 1.25rem;
      font-size:16px;
      border-radius:10px;
      cursor:pointer;
      box-shadow: 0 6px 18px rgba(9,20,40,0.12);
    }
    .btn:active{transform:translateY(1px);}

    /* result area that appears from the bottom */
    .result {
      position: fixed;
      left: 50%;
      bottom: 24px; /* final bottom offset */
      transform: translate(-50%, 120%); /* start off-screen (below) */
      display:flex;
      gap:1rem;
      align-items:center;
      background: rgba(255,255,255,0.98);
      padding: 0.75rem 1rem;
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(9,20,40,0.12);
      max-width: min(92%, 900px);
      transition: transform 420ms cubic-bezier(.2,.9,.2,1), opacity 320ms;
      opacity:0;
      z-index: 1200;
    }
    .result.show{
      transform: translate(-50%, 0%); /* slide into view from bottom */
      opacity:1;
    }
    .result .text{
      font-size:18px;
      font-weight:600;
      color:var(--text);
      white-space:nowrap;
    }
    .result .gif{
      max-height:90px;
      max-width:160px;
      border-radius:8px;
      object-fit:cover;
      box-shadow:0 8px 18px rgba(9,20,40,0.08);
    }

    /* make gif larger on small screens */
    @media (max-width:520px){
      .hello h1{font-size:34px;}
      .result {flex-direction:column; gap:.5rem; padding:0.5rem; bottom:16px;}
      .result .gif{max-height:150px; max-width:90vw;}
      .result .text{font-size:16px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" role="main" aria-labelledby="hello-title">
      <div class="hello" aria-hidden="false">
        <h1 id="hello-title">Hello Jake</h1>
      </div>

      <div class="action" aria-hidden="false">
        <button id="surpriseBtn" class="btn" aria-controls="result" aria-expanded="false">Surprise me</button>
      </div>
    </div>
  </div>

  <!-- result container (hidden by default) -->
  <div id="result" class="result" role="status" aria-live="polite">
    <div class="text" id="resultText"></div>
    <img id="resultGif" class="gif" src="" alt="Random animated GIF">
  </div>

  <script>
    (function(){
      // A small curated list of public GIF URLs (feel free to replace with your own)
      const gifs = [
        "https://media.giphy.com/media/3oEjI6SIIHBdRxXI40/giphy.gif",
        "https://media.giphy.com/media/26xBwdIuRJiAiT6PO/giphy.gif",
        "https://media.giphy.com/media/l0K4n1g5p1w9kXQ0A/giphy.gif",
        "https://media.giphy.com/media/3o7TKMt1VVNkHV2PaE/giphy.gif",
        "https://media.giphy.com/media/13HgwGsXF0aiGY/giphy.gif",
        "https://media.giphy.com/media/5GoVLqeAOo6PK/giphy.gif"
      ];

      // Phrases: only ONE phrase will be shown per click (random)
      const phrases = [
        "Nice choice!",
        "Here you go!",
        "A little surprise:",
        "Enjoy this one!",
        "Hope this makes you smile!",
        "Random pick:"
      ];

      const btn = document.getElementById('surpriseBtn');
      const result = document.getElementById('result');
      const resultText = document.getElementById('resultText');
      const resultGif = document.getElementById('resultGif');

      // helper: pick random element
      function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

      // Ensure the gif loads before showing (to avoid flicker)
      function showFromBottom(text, gifUrl){
        // Set aria
        btn.setAttribute('aria-expanded', 'true');

        // temporarily hide result to reset animation
        result.classList.remove('show');
        result.style.opacity = '0';

        // update content
        resultText.textContent = text;
        resultGif.src = gifUrl;
        resultGif.alt = text + " (animated GIF)";

        // When the image is loaded (or on error), show the container
        const onLoad = function(){
          // ensure minimal delay so transform transition applies
          requestAnimationFrame(()=> {
            result.classList.add('show');
          });
          cleanup();
        };
        const onError = function(){
          // If gif fails, still show the phrase only
          resultGif.style.display = 'none';
          requestAnimationFrame(()=> result.classList.add('show'));
          cleanup();
        };
        function cleanup(){
          resultGif.removeEventListener('load', onLoad);
          resultGif.removeEventListener('error', onError);
          // make sure gif element is visible again next time
          resultGif.style.display = '';
        }
        resultGif.addEventListener('load', onLoad);
        resultGif.addEventListener('error', onError);

        // In case the browser has cached the image and 'load' already fired,
        // check readyState / complete:
        if(resultGif.complete && resultGif.naturalWidth !== 0){
          onLoad();
        }
      }

      // Hide current result when clicking outside or clicking button again will re-show a new one.
      function hideResult(){
        result.classList.remove('show');
        btn.setAttribute('aria-expanded','false');
      }

      btn.addEventListener('click', function(){
        // pick one phrase and one gif and show them
        const phrase = rand(phrases);
        const gif = rand(gifs);
        // ensure only one phrase appears: we replace content each time
        showFromBottom(phrase, gif);
      });

      // optional: hide result if user clicks anywhere outside it
      document.addEventListener('click', function(e){
        if(!result.contains(e.target) && !btn.contains(e.target)){
          hideResult();
        }
      });

      // keyboard: close on Escape
      document.addEventListener('keydown', function(e){
        if(e.key === 'Escape') hideResult();
      });
    })();
  </script>
</body>
</html>
